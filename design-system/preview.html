<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gliffo Design System — Preview</title>

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="components.css" />

    <style>
      body { margin: 0; font-family: "DM Sans", sans-serif; background: var(--bg); color: var(--text); transition: background .25s, color .25s; }
      .pv-bar { position: sticky; top: 0; z-index: 500; display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
      .pv-bar h1 { font-family: "DM Serif Display", serif; font-size: 1.1rem; margin: 0; }
      .pv-bar .spacer { flex: 1; }
      .pv-themes { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
      .pv-col { padding: 24px 28px 80px; min-height: 100vh; }
      .pv-col[data-theme="dark"]  { background: #141210; border-right: 1px solid #302b22; }
      .pv-col[data-theme="light"] { background: #faf8f4; }
      .pv-col h2 { font-family: "DM Serif Display", serif; font-size: .95rem; color: var(--text2); text-transform: uppercase; letter-spacing: .12em; margin: 0 0 18px; }
      .pv-section { margin-bottom: 34px; }
      .pv-section > .pv-label { font-size: .62rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; }
      .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .pv-stack { display: flex; flex-direction: column; gap: 12px; max-width: 380px; }
      .pv-header-demo { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; }
      .pv-modal-static .gf-moverlay { position: static; background: transparent; backdrop-filter: none; display: block; padding: 0; }
      .pv-modal-static .gf-modal { animation: none; max-width: 380px; }
      @media (max-width: 720px) { .pv-themes { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="pv-bar">
      <h1>Gliffo Design System</h1>
      <span class="spacer"></span>
      <span style="font-size:.75rem;color:var(--text3)">Dark · Light side-by-side</span>
    </div>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- preview.compiled.js is built from preview.src.jsx via esbuild (classic JSX -> React.createElement). -->
    <!-- Rebuild: npx esbuild preview.src.jsx --bundle --jsx=transform \
           --jsx-factory=React.createElement --jsx-fragment=React.Fragment \
           --loader:.jsx=jsx --outfile=preview.compiled.js -->
    <script src="preview.compiled.js"></script>
  </body>
</html>
